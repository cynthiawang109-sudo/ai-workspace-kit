name: Publish doc-search

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Read release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          version = os.environ["RELEASE_TAG"].removeprefix("doc-search-v")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        run: python -m pip install "./mcp/doc-search[dev]" build twine
      - name: Run doc-search tests
        working-directory: mcp/doc-search
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build mcp/doc-search
      - name: Check distribution metadata
        run: python -m twine check mcp/doc-search/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: doc-search-distributions
          path: mcp/doc-search/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/taskflow-doc-search
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doc-search-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  notify:
    needs: [build, publish]
    if: ${{ success() && github.event_name == 'release' }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      text: >-
        Published taskflow-doc-search ${{ needs.build.outputs.version }} to PyPI:
        https://pypi.org/project/taskflow-doc-search/
    secrets: inherit
