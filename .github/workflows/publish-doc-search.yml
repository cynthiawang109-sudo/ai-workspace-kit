name: Publish doc-search

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        run: python -m pip install "./mcp/doc-search[dev]" build twine
      - name: Run doc-search tests
        working-directory: mcp/doc-search
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build mcp/doc-search
      - name: Check distribution metadata
        run: python -m twine check mcp/doc-search/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: doc-search-distributions
          path: mcp/doc-search/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/taskflow-doc-search
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doc-search-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
