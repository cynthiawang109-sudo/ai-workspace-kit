[project]
name = "doc-search"
version = "0.1.0"
description = "MCP server for keyword search over the ai-workspace-kit documentation repos and demo tickets"
requires-python = ">=3.10"
dependencies = ["fastmcp>=4.1.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
